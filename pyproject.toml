[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e-rechnung-python"
version = "0.1.0"
description = "Offline-friendly Python project for German XRechnung"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
e-rechnung = "e_rechnung.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
